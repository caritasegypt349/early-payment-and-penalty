<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مساعد تصفية العملاء من برنامج المحصل</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1800px; margin: auto; background: white; padding: 25px; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 3px solid #3498db; padding-bottom: 10px; font-size: 22px; margin-bottom: 8px; }
        .date-info { text-align: center; margin-bottom: 15px; color: #2980b9; font-weight: bold; font-size: 14px; }
        textarea { width: 100%; height: 130px; padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 13px; resize: vertical; transition: border 0.3s; }
        textarea:focus { border-color: #3498db; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { flex: 1; min-width: 140px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.25s; }
        button:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-process { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
        .btn-excel   { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; }
        .btn-clear   { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-settlement { background: linear-gradient(135deg, #8e44ad, #6c3483); color: white; }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 18px; }
        .mode-tab {
            flex: 1; text-align: center; padding: 12px; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 14px; border: 2px solid transparent;
            background: #ecf0f1; color: #7f8c8d; transition: 0.2s;
        }
        .mode-tab.active-client { background: #eafaf1; color: #1e8449; border-color: #1e8449; }
        .mode-tab.active-insurance { background: #ebf5fb; color: #1a5276; border-color: #1a5276; }
        .mode-note { text-align: center; font-size: 12px; color: #7f8c8d; margin: -8px 0 15px; }
        .settlement-bar {
            display: none; justify-content: center; margin-top: 16px;
        }
        .table-container { overflow-x: auto; margin-top: 20px; max-height: 640px; border: 1px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 1750px; }
        th, td { border: 1px solid #d1d8e0; padding: 9px 10px; text-align: center; font-size: 13px; }
        th { background: #2c3e50; color: white; position: sticky; top: 0; z-index: 10; }
        th.orange-header { background: #e67e22 !important; }
        tbody tr:nth-child(even) td { background-color: #f8f9fa; }
        td.col-index { background: linear-gradient(135deg, #2c3e50, #34495e) !important; color: #f1c40f !important; font-weight: bold; font-size: 14px; min-width: 38px; }
        td.status-past    { color: #636e72; background-color: #f5f6fa !important; }
        td.status-overdue { color: #922b21 !important; font-weight: bold; background-color: #fdecea !important; }
        td.status-current { color: #d35400; font-weight: bold; background-color: #fff3e0 !important; border: 2px solid #e67e22 !important; }
        td.status-future  { color: #1565c0; font-weight: bold; background-color: #e8f0fe !important; }
        .col-penalty { background-color: #fee2e2 !important; color: #b91c1c; font-weight: bold; }
        td.tsf-past    { background-color: #f5f6fa !important; color: #aaa; }
        td.tsf-overdue { background-color: #fdecea !important; font-weight: bold; color: #922b21; }
        td.tsf-current { background-color: #fff3e0 !important; font-weight: bold; color: #bf360c; }
        td.tsf-future  { background-color: #e8f4fd !important; font-weight: bold; color: #1a5276; }
        .total-row td { background-color: #f39c12 !important; font-weight: bold; color: #2c3e50; }
        .final-row td  { background: #0d1b2a !important; color: white !important; }
        .final-row td.final-val { font-size: 22px; font-weight: bold; color: #f1c40f !important; letter-spacing: 1px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .stat-card .val { font-size: 18px; font-weight: bold; display: block; }
        .stat-card .lbl { font-size: 12px; margin-top: 4px; opacity: 0.8; }
        .card-blue   { background: #ebf5fb; color: #1a5276; }
        .card-green  { background: #eafaf1; color: #1e8449; }
        .card-orange { background: #fef9e7; color: #b7770d; }
        .card-red    { background: #fdedec; color: #922b21; }
        .card-gold   { background: #fef3c7; color: #92400e; }
        .card-purple { background: #f5eef8; color: #6c3483; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; align-items: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-paid-early { background:#d5f5e3; color:#1e8449; }
        .badge-paid-late  { background:#fde8d8; color:#a04000; }
        .badge-not-due    { background:#eaf2ff; color:#154360; }
        .disclaimer { text-align: center; color: #e74c3c; font-weight: bold; margin-top: 20px; font-size: 13px; padding: 10px; border: 1px dashed #e74c3c; border-radius: 8px; background-color: #fff5f5; }
        .footer-credit { text-align: center; margin-top: 15px; font-size: 13px; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 12px; }
        .footer-credit span { color: #3498db; font-weight: bold; }
        /* صف التفصيل */
        .breakdown-inner { width:100%; border-collapse:collapse; color:#ecf0f1; background:#1a252f; }
        .breakdown-inner td { border: none; padding: 12px 10px; text-align: center; }
        .bd-label { font-size: 11px; margin-bottom: 5px; }
        .bd-val   { font-size: 17px; font-weight: bold; }
        .bd-sep   { font-size: 22px; color: #7f8c8d; }
        .bd-total-cell { background: #0d1b2a !important; }
        .bd-total-cell .bd-val { font-size: 22px; color: #f1c40f !important; }
    </style>
</head>
<body>
<div class="container">
    <h2>&#x1F3E6; مساعد تصفية العملاء من برنامج المحصل</h2>
    <div class="date-info" id="currentDateDisplay"></div>

    <div class="mode-tabs">
        <div class="mode-tab active-client" id="tabClient" onclick="setMode('client')">&#x1F464; تصفية للعميل (تشمل عمولة 5% والغرامات)</div>
        <div class="mode-tab" id="tabInsurance" onclick="setMode('insurance')">&#x1F3E2; تصفية لشركة التأمين (بدون عمولة ولا غرامات)</div>
    </div>
    <div class="mode-note" id="modeNote"></div>

    <textarea id="dataInput" placeholder="قم بلصق بيانات الأقساط هنا (مباشرةً من برنامج المحصل)..."></textarea>
    <div class="btn-group">
        <button class="btn-process" onclick="processAll()">&#x1F4CA; تحليل البيانات وعرض الإجماليات</button>
        <button class="btn-excel"   onclick="exportToExcel()">&#x1F4E5; تصدير Excel</button>
        <button class="btn-clear"   onclick="clearAll()">&#x1F5D1;&#xFE0F; مسح البيانات</button>
    </div>
    <div id="statsArea"></div>
    <div id="tableOutput" class="table-container"></div>
    <div class="settlement-bar" id="settlementBar">
        <button class="btn-settlement" onclick="openSettlementRequest()">&#x1F4C4; فتح بيانات طلب السداد المعجل بهذه الأرقام (اختياري)</button>
    </div>
    <div class="disclaimer">&#x26A0;&#xFE0F; النظام تحت الاختبار والتعديل.. يرجى مراجعة النتائج بعناية قبل الاعتماد عليها.</div>
    <div class="footer-credit">Powered by <span>Loans &amp; Economic Empowerment IT Group</span></div>
</div>
<script>
const today = new Date();
document.getElementById('currentDateDisplay').innerText =
    "تاريخ التقرير: " + today.toLocaleDateString('ar-EG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

/* ===== تحليل سطر ===== */
function parseLine(line) {
    if (!line.trim()) return null;
    const p = line.trim().split(/\s+/);
    if (p.length < 9) return null;
    if (!/^\d+$/.test(p[0])) return null;
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(p[1])) return null;
    const dp = p[1].split('/');
    const jsDate = new Date(+dp[0], +dp[1]-1, +dp[2]);
    const principal = parseFloat(p[2].replace(/,/g,'')) || 0;
    const fees      = parseFloat(p[3].replace(/,/g,'')) || 0;
    const totalDue  = parseFloat(p[4].replace(/,/g,'')) || 0;
    const paid      = parseFloat(p[7].replace(/,/g,'')) || 0;
    const delayDays = parseInt(p[p.length-1]) || 0;
    const penPerDay = delayDays > 0 ? totalDue * 0.01 : 0;
    const penalty   = Math.min(penPerDay * delayDays, fees);
    return { m:p[0], date:p[1], jsDate, principal, fees, totalDue, paid, delayDays, penalty, statusTxt:p[8]||'' };
}

/* ===== تحديد نوع السطر بناءً على التاريخ =====
   - jsDate < today  → PAST (مسدد) أو OVERDUE (غير مسدد)
   - أول قسط jsDate >= today → CURRENT (الدور عليه)
   - ما بعده → FUTURE
*/
let _currentAssigned = false;
function resetFlag() { _currentAssigned = false; }
function getRowType(row) {
    if (row.jsDate < today) {
        return row.paid < row.totalDue ? 'OVERDUE' : 'PAST';
    }
    if (!_currentAssigned) { _currentAssigned = true; return 'CURRENT'; }
    return 'FUTURE';
}

/* ===== badge ===== */
function badge(txt) {
    if (!txt) return txt;
    if (txt.includes('مبكر'))  return '<span class="badge badge-paid-early">'+txt+'</span>';
    if (txt.includes('متأخر')) return '<span class="badge badge-paid-late">'+txt+'</span>';
    if (txt.includes('يستحق')) return '<span class="badge badge-not-due">'+txt+'</span>';
    return '<span class="badge">'+txt+'</span>';
}

/* ===== الدالة الرئيسية ===== */
let parsedRows = [];
let currentMode = 'client';
let lastClientS = null; /* نتيجة تصفية العميل (تُستخدم دايمًا لزرار طلب السداد المعجل) */

const MODE_NOTES = {
    client:    'يشمل عمولة السداد المعجل (5%) والغرامات — هو المبلغ اللى العميل يدفعه فعليًا.',
    insurance: 'بدون عمولة 5% وبدون غرامات — المبلغ المطلوب من شركة التأمين فقط (الأصول + الفوائد المستحقة).'
};

function setMode(mode) {
    currentMode = mode;
    document.getElementById('tabClient').classList.toggle('active-client', mode === 'client');
    document.getElementById('tabInsurance').classList.toggle('active-insurance', mode === 'insurance');
    document.getElementById('modeNote').textContent = MODE_NOTES[mode];
    if (parsedRows.length) renderAll(mode);
}
setMode('client');

function processAll() {
    const input = document.getElementById('dataInput').value.trim();
    if (!input) { alert('الرجاء لصق البيانات أولاً'); return; }
    resetFlag();
    const rows = input.split('\n').map(parseLine).filter(Boolean);
    if (!rows.length) { alert('لم يتم التعرف على بيانات صحيحة'); return; }
    rows.forEach(r => { r.rowType = getRowType(r); });
    parsedRows = rows;
    renderAll(currentMode);
}

/* ===== حساب التصفية لوضع معيّن (عميل / شركة تأمين) بدون إعادة تحليل النص ===== */
function computeLiquidation(rows, mode) {
    const startIdx = rows.findIndex(r => r.rowType !== 'PAST');
    const isInsurance = mode === 'insurance';

    const tot = {principal:0, fees:0, totalDue:0, paid:0, penalty:0};
    rows.forEach(r => {
        tot.principal += r.principal; tot.fees += r.fees; tot.totalDue += r.totalDue; tot.paid += r.paid;
        tot.penalty += isInsurance ? 0 : r.penalty;
    });

    const rowsCalc = [];
    let accPen = 0;
    let S = null;

    rows.forEach((row, idx) => {
        const effPenalty = isInsurance ? 0 : row.penalty;
        accPen += effPenalty;

        let F=null, G=null, H=null, I=null, fprin=0, overdue=0, waivedFees=0;
        if (idx >= startIdx) {
            F = row.totalDue;
            for (let i=idx+1; i<rows.length; i++) { F += rows[i].principal; fprin += rows[i].principal; waivedFees += rows[i].fees; }
            for (let j=0; j<idx; j++) {
                const d = rows[j].totalDue - rows[j].paid;
                if (d>0) { F += d; overdue += d; }
            }
            G = isInsurance ? 0 : Math.round(fprin * 0.05);
            H = Math.round(F + G);
            I = Math.round(H + accPen - row.paid);

            if (row.rowType === 'CURRENT' && S === null) {
                S = { I, H, G, F: Math.round(F),
                      penalties: Math.round(accPen),
                      overdue:   Math.round(overdue),
                      current:   Math.round(row.totalDue),
                      fprin:     Math.round(fprin),
                      waivedFees: Math.round(waivedFees) };
            }
        }
        rowsCalc.push({ row, effPenalty, F, G, H, I });
    });

    return { tot, rowsCalc, S, startIdx };
}

/* ===== عرض النتائج ===== */
function renderAll(mode) {
    const rows = parsedRows;
    const { tot, rowsCalc, S } = computeLiquidation(rows, mode);

    /* نحتفظ دايمًا بنتيجة تصفية العميل (مهما كان الوضع المعروض حاليًا) عشان زرار طلب السداد المعجل */
    lastClientS = mode === 'client' ? S : computeLiquidation(rows, 'client').S;

    const isInsurance = mode === 'insurance';

    let html = '<table id="resultTable"><thead><tr>'
        +'<th colspan="9">البيانات الأساسية والغرامات</th>'
        +'<th colspan="5" class="orange-header">منطقة حساب التصفية '+(isInsurance?'(شركة التأمين)':'(العميل)')+'</th>'
        +'</tr><tr>'
        +'<th>م</th><th>تاريخ الاستحقاق</th><th>أصل</th><th>مصاريف</th><th>الإجمالي</th>'
        +'<th>المسدد</th><th>أيام تأخير</th><th class="col-penalty">غرامة</th><th>حالة القسط</th>'
        +'<th class="orange-header">حالة السطر</th>'
        +'<th class="orange-header">الرصيد (F)</th>'
        +'<th class="orange-header">'+(isInsurance?'عمولة (غير مطبقة)':'عمولة 5% (G)')+'</th>'
        +'<th class="orange-header">المطلوب قبل الغرامات (H)</th>'
        +'<th class="orange-header">'+(isInsurance?'الصافي (بدون غرامات)':'الصافي شامل الغرامات (I)')+'</th>'
        +'</tr></thead><tbody>';

    const LABELS = {
        PAST:    { txt:'سابق (مسدد)',        td:'status-past',    tsf:'tsf-past'    },
        OVERDUE: { txt:'متأخر غير مسدد',     td:'status-overdue', tsf:'tsf-overdue' },
        CURRENT: { txt:'استحقاق حالي',       td:'status-current', tsf:'tsf-current' },
        FUTURE:  { txt:'تصفية مستقبلي',      td:'status-future',  tsf:'tsf-future'  },
    };

    rowsCalc.forEach(({row, effPenalty, F, G, H, I}) => {
        const {txt, td, tsf} = LABELS[row.rowType];
        const Ft = F!==null ? Math.round(F).toLocaleString('en-US') : '-';
        const Gt = G!==null ? G.toLocaleString('en-US') : '-';
        const Ht = H!==null ? H.toLocaleString('en-US') : '-';
        const It = I!==null ? I.toLocaleString('en-US') : '-';

        html += '<tr>'
            +'<td class="col-index">'+row.m+'</td>'
            +'<td>'+row.date+'</td>'
            +'<td>'+row.principal.toLocaleString('en-US')+'</td>'
            +'<td>'+row.fees.toLocaleString('en-US')+'</td>'
            +'<td>'+row.totalDue.toLocaleString('en-US')+'</td>'
            +'<td>'+row.paid.toLocaleString('en-US')+'</td>'
            +'<td>'+(row.delayDays>0?row.delayDays:'-')+'</td>'
            +'<td class="col-penalty">'+(effPenalty>0?effPenalty.toLocaleString('en-US'):'-')+'</td>'
            +'<td>'+badge(row.statusTxt)+'</td>'
            +'<td class="'+td+'">'+txt+'</td>'
            +'<td class="'+tsf+'">'+Ft+'</td>'
            +'<td class="'+tsf+'">'+Gt+'</td>'
            +'<td class="'+tsf+'">'+Ht+'</td>'
            +'<td class="'+tsf+'">'+It+'</td>'
            +'</tr>';
    });

    /* ---- صف الإجماليات ---- */
    const totalOD = Math.round(tot.totalDue - tot.paid + tot.penalty);
    html += '<tr class="total-row">'
        +'<td colspan="2">إجمالي المسحوبات</td>'
        +'<td>'+Math.round(tot.principal).toLocaleString('en-US')+'</td>'
        +'<td>'+Math.round(tot.fees).toLocaleString('en-US')+'</td>'
        +'<td>'+Math.round(tot.totalDue).toLocaleString('en-US')+'</td>'
        +'<td>'+Math.round(tot.paid).toLocaleString('en-US')+'</td>'
        +'<td>-</td>'
        +'<td class="col-penalty">'+Math.round(tot.penalty).toLocaleString('en-US')+'</td>'
        +'<td colspan="2">'+(isInsurance?'إجمالي المتأخرات الفعلي (بدون غرامات):':'إجمالي المتأخرات الفعلي (شامل الغرامات):')+'</td>'
        +'<td colspan="4" style="font-size:15px;font-weight:bold;color:#7b0000;">'+totalOD.toLocaleString('en-US')+' ج.م</td>'
        +'</tr>';

    if (S !== null) {
        /* ---- صف التفصيل ---- */
        const hasOD = S.overdue > 0;
        let cells = '';
        if (hasOD) {
            cells += '<td class="bd-sep" style="width:3%"></td>'
                +'<td style="width:14%">'
                +'<div class="bd-label" style="color:#e74c3c;">متأخرات غير مسددة</div>'
                +'<div class="bd-val" style="color:#ff6b6b;">'+S.overdue.toLocaleString('en-US')+' ج.م</div>'
                +'</td>'
                +'<td class="bd-sep">+</td>';
        }
        cells += '<td style="width:14%">'
            +'<div class="bd-label" style="color:#f39c12;">قسط الاستحقاق الحالي</div>'
            +'<div class="bd-val" style="color:#f39c12;">'+S.current.toLocaleString('en-US')+' ج.م</div>'
            +'</td>'
            +'<td class="bd-sep">+</td>'
            +'<td style="width:14%">'
            +'<div class="bd-label" style="color:#5dade2;">أصول مستقبلية</div>'
            +'<div class="bd-val" style="color:#5dade2;">'+S.fprin.toLocaleString('en-US')+' ج.م</div>'
            +'</td>';

        if (!isInsurance) {
            cells += '<td class="bd-sep">+</td>'
                +'<td style="width:14%">'
                +'<div class="bd-label" style="color:#2ecc71;">عمولة 5% (على الأصول)</div>'
                +'<div class="bd-val" style="color:#2ecc71;">'+S.G.toLocaleString('en-US')+' ج.م</div>'
                +'</td>'
                +'<td class="bd-sep">+</td>'
                +'<td style="width:14%">'
                +'<div class="bd-label" style="color:#e74c3c;">إجمالي الغرامات</div>'
                +'<div class="bd-val" style="color:#ff6b6b;">'+S.penalties.toLocaleString('en-US')+' ج.م</div>'
                +'</td>';
        }

        cells += '<td class="bd-sep">=</td>'
            +'<td class="bd-total-cell" style="width:16%">'
            +'<div class="bd-label" style="color:#f1c40f;">إجمالي مبلغ التصفية</div>'
            +'<div class="bd-val">'+S.I.toLocaleString('en-US')+' ج.م</div>'
            +'</td>';

        html += '<tr><td colspan="14" style="padding:0;">'
            +'<table class="breakdown-inner"><tr>'
            +'<td style="padding:8px 15px;color:#bdc3c7;font-size:12px;white-space:nowrap;width:auto;">'
            +'تفصيل مبلغ التصفية</td>'
            +cells
            +'</tr></table>'
            +'</td></tr>';

        if (!isInsurance && S.waivedFees > 0) {
            html += '<tr><td colspan="14" style="padding:6px 15px;background:#fdf6e3;color:#7d6608;font-size:12.5px;text-align:right;">'
                +'&#x1F4A1; قيمة الفوائد المتبقية المخصومة على العميل نتيجة السداد المعجل (فوائد الأقساط المستقبلية التى لن تُحصَّل): <strong>'
                +S.waivedFees.toLocaleString('en-US')+' ج.م</strong></td></tr>';
        }

        html += '<tr class="final-row">'
            +'<td colspan="9" style="text-align:right;padding-right:20px;font-size:14px;">'
            +(isInsurance ? 'صافي المبلغ المطلوب من شركة التأمين:' : 'صافي المبلغ المطلوب لتصفية القرض بالكامل:')
            +'</td>'
            +'<td colspan="5" class="final-val">'+S.I.toLocaleString('en-US')+' جنيه مصري</td>'
            +'</tr>';
    } else {
        html += '<tr class="final-row"><td colspan="14" style="font-size:18px;color:#2ecc71;font-weight:bold;padding:16px;">'
            +'جميع الأقساط المستحقة مسددة — لا توجد تصفية مطلوبة'
            +'</td></tr>';
    }

    html += '</tbody></table>';
    document.getElementById('tableOutput').innerHTML = html;

    /* ---- زرار طلب السداد المعجل: يظهر فقط لو فيه تصفية فعلية للعميل ---- */
    document.getElementById('settlementBar').style.display = (lastClientS !== null) ? 'flex' : 'none';

    /* ---- بطاقات الإحصاء ---- */
    const pastC    = rows.filter(r=>r.rowType==='PAST').length;
    const overdueC = rows.filter(r=>r.rowType==='OVERDUE').length;
    const currentC = rows.filter(r=>r.rowType==='CURRENT').length;
    const futureC  = rows.filter(r=>r.rowType==='FUTURE').length;

    document.getElementById('statsArea').innerHTML =
        '<div class="stats-grid">'
        +'<div class="stat-card card-blue"><span class="val">'+rows.length+'</span><span class="lbl">إجمالي الأقساط</span></div>'
        +'<div class="stat-card card-green"><span class="val">'+pastC+'</span><span class="lbl">سابقة مسددة</span></div>'
        +'<div class="stat-card card-red"><span class="val">'+overdueC+'</span><span class="lbl">متأخرة غير مسددة</span></div>'
        +'<div class="stat-card card-orange"><span class="val">'+currentC+'</span><span class="lbl">استحقاق الشهر الحالي</span></div>'
        +'<div class="stat-card card-purple"><span class="val">'+futureC+'</span><span class="lbl">أقساط مستقبلية</span></div>'
        +'<div class="stat-card card-gold"><span class="val">'+Math.round(tot.penalty).toLocaleString('en-US')+'</span><span class="lbl">إجمالي الغرامات (ج.م)</span></div>'
        +'</div>'
        +'<div class="legend"><strong>دليل الألوان:</strong>'
        +'<div class="legend-item"><div class="legend-box" style="background:#f5f6fa;border:1px solid #ccc"></div> سابق مسدد</div>'
        +'<div class="legend-item"><div class="legend-box" style="background:#fdecea;border:1px solid #e74c3c"></div> متأخر غير مسدد</div>'
        +'<div class="legend-item"><div class="legend-box" style="background:#fff3e0;border:2px solid #e67e22"></div> استحقاق حالي</div>'
        +'<div class="legend-item"><div class="legend-box" style="background:#e8f0fe;border:1px solid #3498db"></div> مستقبلي</div>'
        +'<div class="legend-item"><div class="legend-box" style="background:#fee2e2"></div> غرامة تأخير</div>'
        +'</div>';
}

/* ===== فتح بيانات طلب السداد المعجل (اختيارى) =====
   عدّل الرابط ده لو صفحة طلب السداد المعجل عندكم على مسار مختلف */
const SETTLEMENT_FORM_URL = "https://caritasegypt349.github.io/Advance-Payment/";

function openSettlementRequest() {
    if (!lastClientS) { alert('محتاج تحلل بيانات فيها تصفية مطلوبة الأول'); return; }
    const S = lastClientS;
    const params = new URLSearchParams({
        principal: S.F,
        commission: S.G,
        total: S.H,
        remainingInterest: S.waivedFees,
        totalRemaining: S.F + S.waivedFees
        /* ملحوظة: الغرامة مش بتتبعت لأن نموذج طلب السداد المعجل مفهوش خانة غرامة */
    });
    window.open(SETTLEMENT_FORM_URL + '?' + params.toString(), '_blank');
}

function exportToExcel() {
    const t = document.getElementById('resultTable');
    if (!t) { alert('لا توجد بيانات للتصدير'); return; }
    const wb = XLSX.utils.table_to_book(t, {sheet:'تقرير التصفية'});
    XLSX.writeFile(wb, 'تقرير_تصفية_القرض.xlsx');
}

function clearAll() {
    document.getElementById('dataInput').value = '';
    document.getElementById('tableOutput').innerHTML = '';
    document.getElementById('statsArea').innerHTML = '';
    document.getElementById('settlementBar').style.display = 'none';
    parsedRows = [];
    lastClientS = null;
}
</script>
</body>
</html>
